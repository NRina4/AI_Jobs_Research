[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-jobs-research"
version = "0.1.0"
description = "Information system for analyzing the AI labor market"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.4",
    "psycopg[binary]>=3.3.8",
    "pydantic-settings>=2.16.2",
    "sqlalchemy>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ai_jobs"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
ignore = ["F821"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
